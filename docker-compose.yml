x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges=true

services:
  npm:
    <<: *defaults
    image: lepresidente/nginxproxymanager:latest
    container_name: npm
    networks: [crowdsec, npm]
    ports:
      - "80:80"
      - "443:443"
      - "81:81" # admin UI
      - "25565-25570:25565-25570/tcp" # NPM streams (e.g. Minecraft)
    environment:
      DB_MYSQL_HOST: db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      DB_MYSQL_NAME: npm
      CROWDSEC_OPENRESTY_BOUNCER: |
        ENABLED=true
        API_URL=http://crowdsec:8080
        API_KEY=${CROWDSEC_BOUNCER_APIKEY}
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *defaults
    image: mariadb:lts
    container_name: npm-db
    networks: [npm]
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_DATABASE_PASSWORD}
      MYSQL_DATABASE: npm
      MYSQL_USER: npm
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--innodb_initialized"]
      start_period: 5s
      timeout: 5s
      interval: 5s
      retries: 5

  crowdsec:
    <<: *defaults
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    networks: [crowdsec]
    environment:
      COLLECTIONS: crowdsecurity/nginx-proxy-manager
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - npm-data:/data:ro
    # Configs instead of bind mounts: Portainer CE git stacks can't resolve relative paths
    configs:
      - source: crowdsec_acquis
        target: /etc/crowdsec/acquis.yaml
      - source: crowdsec_whitelists
        target: /etc/crowdsec/parsers/s02-enrich/local-whitelists.yaml
      - source: crowdsec_jellyfin_whitelist
        target: /etc/crowdsec/parsers/s02-enrich/local-jellyfin-whitelist.yaml

  # Register before first start (same password as CROWDSEC_WEBUI_PASSWORD):
  #   docker exec crowdsec cscli machines add crowdsec-web-ui --password '<pw>' -f /dev/null
  crowdsec-web-ui:
    <<: *defaults
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    container_name: crowdsec-web-ui
    networks: [crowdsec]
    ports:
      - "3000:3000" # must stay closed in the provider firewall
    environment:
      CONFIG_INSTANCE_LAPI_URL: http://crowdsec:8080
      CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
      CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: ${CROWDSEC_WEBUI_PASSWORD}
    volumes:
      - crowdsec-webui-data:/app/data
    depends_on:
      - crowdsec

networks:
  crowdsec:
  npm:

volumes:
  npm-data:
  npm-letsencrypt:
  db-mysql:
  crowdsec-config:
  crowdsec-data:
  crowdsec-webui-data:

configs:
  crowdsec_acquis:
    content: |
      filenames:
        - /data/logs/*.log
      labels:
        type: nginx-proxy-manager

  crowdsec_whitelists:
    content: |
      name: local/whitelists
      description: "Own networks that must never be banned"
      whitelist:
        reason: "Own devices"
        cidr:
          - "100.64.0.0/10" # Tailscale

  crowdsec_jellyfin_whitelist:
    content: |
      name: local/jellyfin-api-whitelist
      description: "Don't treat successful Jellyfin API calls as crawling/probing"
      whitelist:
        reason: "Jellyfin clients make many API requests"
        expression:
          # Successful responses only; 401, 404 and exploits are still detected
          - evt.Meta.target_fqdn == 'jellyfin.tk05.org' && evt.Meta.http_status in ['200', '206', '304']
